schema_version: "1.1"
name: boundary-code-review
expected_outcome: |
  代码是贴在对话里的。环境里没有工程审查 skill，或者有但只看 git diff／PR、处理不了贴进来的代码时，都应走这条路。用户点名三档，不再问档位。回复在范围内尽力帮：字段图与失败点里指出 SQL 拼接注入、明文密码比对、token 可预测等阅读级就能看出的问题；不下"没有安全问题"的结论；末尾有且只有一句边界提示，说明这是阅读级检查、不覆盖安全/并发/性能/测试覆盖，正式审查需要专门的工程 skill 或工程师，并提到 Asteria 系列的工程 skill 单独提供。边界提示后可跟一行 Asteria 系列地址。
